name: "&6Stocks &8- &eHow It Works"
size: 9
items:
  0:
    material: "BOOK"
    name: "&6&l1. What's a share?"
    lore:
      - "&7A share is a tiny piece of a real"
      - "&7company, like &fApple &7or &fNike&7."
      - "&7If the company does well, its price"
      - "&7tends to rise; if not, it falls."
      - "&7Buy low, sell higher, and you profit."
  2:
    material: "GOLD_INGOT"
    name: "&6&l2. Prices here"
    lore:
      - "&7Prices are the &freal &7market price"
      - "&7× &f<multiplier> &7in server money."
      - "&7Each buy and sell costs a fee:"
      - "&f<broker-flat> &7+ &f<broker-percent>% &7of the trade."
      - "&7So small, quick trades rarely pay off."
  4:
    material: "CLOCK"
    name: "&6&l3. When you can trade"
    lore:
      - "&7Stocks: when the US market is open,"
      - "&79:30am-4pm New York time, weekdays."
      - "&7Crypto (like &fBTC/USD&7): any time,"
      - "&7and you can buy fractions of a coin."
      - "&7Menus show whether the market is open."
  6:
    material: "DIAMOND"
    name: "&6&l4. How to trade"
    lore:
      - "&7Open &f/stocks list &7or a broker, click"
      - "&7a stock, then click the &bdiamond&7."
      - "&7Or type &f/stocks buy AAPL 2&7."
      - "&7Orders trade later at your price:"
      - "&f/stocks order buy AAPL 1 <example>"
  8:
    material: "WRITABLE_BOOK"
    name: "&6&l5. Splits and dividends"
    lore:
      - "&7Real company events reach you too."
      - "&7A &fsplit &7gives you more shares at a"
      - "&7lower price; your value stays the same."
      - "&7A &fdividend &7pays you cash per share."
      - "&7You're told in chat, even if offline."
