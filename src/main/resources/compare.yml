name: "&6Stocks &8- &eCompare"
# One row per stock; slots below are within that row. Click any item to open the stock.
per-stock: 9
items:
  0:
    material: "NAME_TAG"
    name: "&6&l<symbol>"
    lore:
      - "&7<name>"
      - "<market-status>"
  1:
    material: "PAPER"
    name: "&6&lToday"
    lore:
      - "&6Price: &e<market-price> &7(<change-close>&7)"
      - "&6High / low: &e<day-high> &7/ &e<day-low>"
      - "&6Volume: &e<volume>"
  2:
    material: "CLOCK"
    name: "&6&lPast year"
    lore:
      - "&6High / low: &e<year-high> &7/ &e<year-low>"
      - "&6vs 50-day average: <change-50-moving-avg>"
      - "&6vs 200-day average: <change-200-moving-avg>"
  3:
    material: "DIAMOND"
    name: "&b&lServer price"
    lore:
      - "&e<server-price>"
      - "&6<one> with fees: &e<buy-one-total>"
  4:
    material: "GOLD_INGOT"
    name: "&6&lYour position"
    lore:
      - "&6You own: &e<owned>"
      - "&6Gain or loss after fees: <position-net>"
