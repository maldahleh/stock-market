prefix: "&6&lStocks &8» &r"
commands-disabled: "&cCommands are disabled; please use a stock broker."
invalid-syntax: "&eInvalid syntax. Use &6/stocks help&e."
invalid-quantity: "&eThat isn't a valid number of shares."
no-permission: "&eYou don't have permission to do that."
player-only: "&cOnly players can use this command."
player-not-found: "&eNo player called &6<player>&e has played here."
compare-max: "&eYou can compare up to 3 symbols at a time."
no-data: "&eNo data was found."
not-configured: "&cThe stock market isn't set up yet. An admin needs to add an Alpaca key to config.yml."
broker-spawned: "&eStock broker spawned."
broker-removed: "&eRemoved the nearest stock broker."
no-broker-nearby: "&eThere's no stock broker within 5 blocks of you."
nothing-to-confirm: "&eThere's no trade waiting for confirmation."
confirm:
  buy: "Buy"
  sell: "Sell"
  title: "&8Confirm: <action> <quantity> <symbol>"
  yes: "&a&lConfirm"
  no: "&c&lCancel"
  details:
    - "&7<action> &f<quantity> &7× &f<symbol>"
    - "&7About &f<estimate> &7before fees"
    - "&7The final price is set when the trade runs."
  chat: "&e<action> &6<quantity> &e× &6<symbol>&e for about &6<estimate>&e? This needs a confirmation."
  button: "&a&l[Click to confirm] &7(or type /stocks confirm within 30 seconds)"
reloaded: "&eReloaded messages and menus. Restart the server to apply other config changes."
pending:
  lookup: "&eLooking up &6<symbol>&e..."
  compare: "&eLooking up stocks..."
  trade: "&eGetting the latest price..."
  menu: "&eLoading..."
failures:
  INVALID_QUANTITY: "&eThat isn't a valid number of shares."
  TOO_MANY_SHARES: "&eThat's more shares than one trade allows."
  BUSY: "&eYour last trade is still processing."
  COOLDOWN: "&ePlease wait a moment between trades."
  INVALID_SYMBOL: "&e&6<symbol>&e isn't a listed symbol."
  NOT_TRADABLE: "&e&6<symbol>&e can't be traded here."
  CRYPTO_DISABLED: "&eCrypto trading is turned off on this server."
  MARKET_CLOSED: "&eThe stock market is closed. It's open 9:30 to 4:00 New York time on weekdays."
  STALE_PRICE: "&eThere's no recent price for &6<symbol>&e, so it can't be traded right now."
  PRICE_TOO_LOW: "&e&6<symbol>&e is priced too low to trade."
  PRICE_MOVED: "&eThe price of &6<symbol>&e moved past your limit."
  INSUFFICIENT_FUNDS: "&eYou don't have enough money for that purchase."
  INSUFFICIENT_SHARES: "&eYou don't own that many shares of &6<symbol>&e."
  DATA_UNAVAILABLE: "&cPrices couldn't be loaded right now. Try again shortly."
  STORAGE_ERROR: "&cThe trade couldn't be saved, so nothing changed. Tell an admin."
bought:
  - "&6Bought &e<quantity> &6× &e<name> &6(&e<symbol>&6)"
  - "&6Price: &e<price> &6each, value &e<value>"
  - "&6Fees: &e<fees>&6, total paid &e<total>"
sold:
  - "&6Sold &e<quantity> &6× &e<name> &6(&e<symbol>&6)"
  - "&6Price: &e<price> &6each, value &e<value>"
  - "&6Fees: &e<fees>&6, total received &e<total>"
  - "&6Gain or loss on these shares: &e<net>"
corporate-action: "&6Market news: &e<action>&6. Your holdings were updated<payout>."
corporate-action-payout: " and you were paid &e<amount>"
help:
  - "&eTrade real stocks and crypto with server money. Prices come from the real market."
  - "&eLearn the basics with &6/stocks tutorial&e."
  - " "
  - "&6&lCommands:"
  - "<commands>"
commands:
  help: "&e/stocks help &6- &eShow this message"
  list: "&e/stocks list &6- &ePopular stocks"
  tutorial: "&e/stocks tutorial &6- &eLearn about the stock market"
  lookup: "&e/stocks lookup <symbol> &6- &eDetails on a stock"
  compare: "&e/stocks compare <symbol,symbol,...> &6- &eCompare up to 3 stocks"
  portfolio: "&e/stocks portfolio [player] &6- &eShares you own"
  transactions: "&e/stocks transactions [player] &6- &eYour trade history"
  history: "&e/stocks history [symbol] &6- &eRecent trades on the server"
  buy: "&e/stocks buy <symbol> [shares] &6- &eBuy shares"
  sell: "&e/stocks sell <symbol> [shares|all] &6- &eSell shares"
  order: "&e/stocks order <buy|sell|stop> <symbol> <shares> <price> &6- &ePlace an order"
  orders: "&e/stocks orders &6- &eYour open orders (cancel with /stocks order cancel <id>)"
  confirm: "&e/stocks confirm &6- &eConfirm a large trade"
  spawnbroker: "&e/stocks spawnbroker &6- &eSpawn a broker villager here"
  removebroker: "&e/stocks removebroker &6- &eRemove the nearest broker (within 5 blocks)"
  reload: "&e/stocks reload &6- &eReload messages and menus"
entry-types:
  BUY: "Purchase"
  SELL: "Sale"
  SPLIT: "Split"
  RENAME: "Rename"
  MERGER: "Merger"
  SPIN_OFF: "Spin-off"
  REMOVED: "Delisted"
  CASH_IN_LIEU: "Cash for fraction"
  DIVIDEND: "Dividend"
orders:
  usage: "&eUse &6/stocks order buy|sell|stop <symbol> <shares> <price>&e or &6/stocks order cancel <id>&e."
  none: "&eYou have no open orders."
  header: "&6Your open orders &7(prices are per share):"
  line:
    LIMIT_BUY: "&7#<id> &eBuy &6<quantity> <symbol> &eat &6<target>&e or less &7(until <expires>)"
    LIMIT_SELL: "&7#<id> &eSell &6<quantity> <symbol> &eat &6<target>&e or more &7(until <expires>)"
    STOP_SELL: "&7#<id> &eStop-loss: sell &6<quantity> <symbol> &eif it falls to &6<target> &7(until <expires>)"
  placed:
    LIMIT_BUY: "&eOrder &6#<id>&e placed: buy &6<quantity> <symbol>&e when it's &6<target>&e or less. The money is taken when it fills."
    LIMIT_SELL: "&eOrder &6#<id>&e placed: sell &6<quantity> <symbol>&e when it's &6<target>&e or more."
    STOP_SELL: "&eStop-loss &6#<id>&e placed: sell &6<quantity> <symbol>&e if it falls to &6<target>&e."
  filled: "&aOrder &6#<id>&a filled."
  cancelled: "&eOrder &6#<id>&e (<quantity> <symbol>) was cancelled: <reason>."
  cancelled-by-you: "&eOrder &6#<id>&e cancelled."
  not-found: "&eYou have no open order &6#<id>&e."
  causes:
    BY_PLAYER: "you cancelled it"
    EXPIRED: "it expired"
    NOT_ENOUGH_MONEY: "you didn't have enough money when it triggered"
    NOT_ENOUGH_SHARES: "you no longer had enough shares"
    NOT_TRADABLE: "the stock can't be traded any more"
    CORPORATE_ACTION: "a split, merger or rename changed the stock's price, so the target no longer means the same thing"
  problems:
    INVALID_QUANTITY: "&eThat isn't a valid number of shares."
    INVALID_PRICE: "&eThat isn't a valid price."
    TOO_MANY_ORDERS: "&eYou have the most open orders allowed. Cancel one first."
    NOT_ENOUGH_SHARES: "&eYou don't own that many shares of &6<symbol>&e."
    INVALID_SYMBOL: "&e&6<symbol>&e isn't a listed symbol."
    NOT_TRADABLE: "&e&6<symbol>&e can't be traded here."
    CRYPTO_DISABLED: "&eCrypto trading is turned off on this server."
    DATA_UNAVAILABLE: "&cMarket data couldn't be loaded right now. Try again shortly."
    STORAGE_ERROR: "&cThe order couldn't be saved. Tell an admin."
