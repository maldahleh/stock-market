name: "&6Stocks &8- &e<symbol>"
size: 27
items:
  0:
    material: "NAME_TAG"
    name: "&6&l<name>"
    lore:
      - "&7<symbol> on <exchange>"
      - "<market-status>"
  2:
    material: "PAPER"
    name: "&6&lToday &7(real market, USD)"
    lore:
      - "&6Price: &e<market-price> &7(<change-close>&7)"
      - "&6Open: &e<open-price>"
      - "&6High / low: &e<day-high> &7/ &e<day-low>"
      - "&6Previous close: &e<close-price>"
      - "&6Volume: &e<volume>"
      - "&7Last trade <last-trade>"
  4:
    material: "DIAMOND"
    name: "&b&lBuy or sell"
    trade: true
    lore:
      - "&6Server price: &e<server-price>"
      - "&7(real price × <multiplier>)"
      - "&6<one> with fees: &e<buy-one-total>"
      - "&6Fees: &e<broker-flat> &6+ &e<broker-percent>%"
      - ""
      - "&6Left click: &eBuy <one>"
      - "&6Shift-left: &eBuy <bulk>"
      - "&6Right click: &eSell <one>"
      - "&6Shift-right: &eSell all"
  6:
    material: "CLOCK"
    name: "&6&lPast year &7(real market, USD)"
    lore:
      - "&6High: &e<year-high> &7(<change-year-high>&7 from it)"
      - "&6Low: &e<year-low> &7(<change-year-low>&7 from it)"
      - "&6vs 50-day average: <change-50-moving-avg>"
      - "&6vs 200-day average: <change-200-moving-avg>"
  8:
    material: "GOLD_INGOT"
    name: "&6&lYour position"
    lore:
      - "&6You own: &e<owned>"
      - "&6Worth: &e<position-value>"
      - "&6Gain or loss after fees: <position-net>"
  18:
    material: "ARROW"
    name: "&6Back"
    action: "back"
  22:
    material: "SUNFLOWER"
    name: "&6Refresh"
    action: "refresh"
  26:
    material: "BARRIER"
    name: "&cClose"
    action: "close"
historical:
  up:
    material: "LIME_CONCRETE"
    name: "&a<date>"
    lore:
      - "&6Open: &e<day-open>"
      - "&6Close: &e<day-close>"
      - "&6High / low: &e<day-high> &7/ &e<day-low>"
      - "&6Volume: &e<volume>"
  down:
    material: "RED_CONCRETE"
    name: "&c<date>"
    lore:
      - "&6Open: &e<day-open>"
      - "&6Close: &e<day-close>"
      - "&6High / low: &e<day-high> &7/ &e<day-low>"
      - "&6Volume: &e<volume>"
  no-data:
    material: "GRAY_STAINED_GLASS_PANE"
    name: "&7No price history"
  slots: [9, 10, 11, 12, 13, 14, 15, 16, 17]
